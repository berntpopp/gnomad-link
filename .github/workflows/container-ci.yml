name: Container CI

on:
  pull_request:
    paths:
      - gnomad_link/**
      - docker/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - .github/workflows/container-ci.yml
  push:
    branches:
      - main
    paths:
      - gnomad_link/**
      - docker/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - .github/workflows/container-ci.yml

concurrency:
  group: container-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-ci:
    uses: berntpopp/genefoundry-router/.github/workflows/_container-ci.yml@9051b1df78232ebbd691b1a2790e94b13de075a9 # genefoundry-router v0.13.15
